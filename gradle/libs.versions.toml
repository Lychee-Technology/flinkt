# Pinned versions. Every version here is exact: no dynamic selectors such as `2.4.+`.
# Why each one was chosen, and how to change it, is in docs/build.md.

[versions]
# The JDK that compiles Flinkt and runs its tests, provisioned as a Gradle toolchain.
jdk = "17"
# The bytecode target and JDK API level of every module. Flink 1.20 still runs on Java 8.
jvm-target = "1.8"
# The build compiler: the Kotlin Gradle plugin that builds Flinkt, and the compiler every suite runs on.
# A stable release, 2.4.0 or later, whose key hashes are measured (docs/kotlin-compatibility.md).
kotlin = "2.4.21"
# The minimum supported Kotlin compiler. The compile-test harness compiles user-side snippets with it,
# and published modules depend on this kotlin-stdlib, not the build compiler's.
kotlin-minimum = "2.4.0"
# KSP, pinned once for the whole build. Tested with Kotlin 2.4.0 through 2.4.21.
ksp = "2.3.13"
# Reads Flink's class files for the parameter names of the view forwarders (flinkt-view-codegen), and the views' and
# Flink's class files in the adapters' structural tests. Build time only.
asm = "9.11.1"
# One Flink release per adapter line. The adapter compiles against it and tests run on it.
flink23 = "2.3.0"
flink120 = "1.20.5"
# Flink 2.2 has no adapter yet (#27). Until it has, the 2.3 adapter compiles and runs the record format's evidence
# against this release too (docs/build.md#adapters).
flink22 = "2.2.1"
junit = "6.1.3"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-standalone = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
ksp-common-deps = { module = "com.google.devtools.ksp:symbol-processing-common-deps", version.ref = "ksp" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
flink-streaming-java = { module = "org.apache.flink:flink-streaming-java" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
